[project]
name = "agnw-rc"
version = "0.1.0"
description = "Reservoir computing with the AgNW network simulator (agnw-sim)"
requires-python = ">=3.10"
dependencies = [
    "agnw-sim",          # AgNW_FDT_Memristor_Framework, installed editable (see README)
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["agnw_rc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
